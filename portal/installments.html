<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Installment Schedule</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="user-home.html">User Home</a>
        <a class="sbLink" href="user.html">My Plots</a>
        <a class="sbLink" href="my-payments.html">My Payments</a>
        <a class="sbLink active" href="installments.html">Installments</a>
        <a class="sbLink" href="profile.html">Profile</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Installment Schedule</h1>
        <div class="actions" id="who"></div>
      </header>

      <section class="card">
        <div class="cardHeader"><h2>My Plans</h2></div>
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Plot</th>
                <th>Start</th>
                <th>Frequency</th>
                <th class="right">Installments</th>
                <th class="right">Each Amount</th>
              </tr>
            </thead>
            <tbody id="planBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card" style="margin-top:14px;">
        <div class="cardHeader"><h2>Schedule</h2></div>
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Plot</th>
                <th>Due Date</th>
                <th class="right">Due Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="schedBody"></tbody>
          </table>
        </div>
        <div class="help" style="padding:10px;color:#666;">
          Status is calculated using your payments (Paid till date vs total due).
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPlots, listPayments } from "./db.js";
    import { listInstallmentPlans } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();
    if (profile.role === "admin") window.location.href = "./index.html";
    document.getElementById("who").textContent = profile.name || "User";

    const [plots, payments, plans] = await Promise.all([
      listPlots(),       // RLS: only assigned
      listPayments(),    // RLS: only own
      listInstallmentPlans() // RLS: only own
    ]);

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    const planBody = document.getElementById("planBody");
    planBody.innerHTML = plans.map(pl => {
      const plot = plots.find(p => p.id === pl.plot_id);
      return `
        <tr>
          <td><strong>${plot?.plot || "-"}</strong></td>
          <td>${pl.start_date}</td>
          <td>${pl.frequency}</td>
          <td class="right">${pl.installments_count}</td>
          <td class="right">${money(pl.installment_amount)}</td>
        </tr>
      `;
    }).join("") || `<tr><td colspan="5">No installment plan set. Ask admin to set your plan.</td></tr>`;

    function addMonths(dt, m){
      const d = new Date(dt);
      d.setMonth(d.getMonth() + m);
      return d;
    }
    function addDays(dt, days){
      const d = new Date(dt);
      d.setDate(d.getDate() + days);
      return d;
    }
    function fmtDate(d){
      return d.toISOString().slice(0,10);
    }

    // Build schedule lines for all plans
    const sched = [];
    for (const plan of plans) {
      for (let i = 1; i <= plan.installments_count; i++) {
        const base = new Date(plan.start_date);
        const due = plan.frequency === "weekly" ? addDays(base, 7*(i-1)) : addMonths(base, (i-1));
        sched.push({
          plot_id: plan.plot_id,
          n: i,
          due_date: fmtDate(due),
          due_amount: Number(plan.installment_amount),
        });
      }
    }

    // Determine "Paid/Pending" by comparing cumulative due vs paid
    const paidByPlot = {};
    for (const p of payments) {
      paidByPlot[p.plot_id] = (paidByPlot[p.plot_id] || 0) + Number(p.amount||0);
    }

    // Render schedule sorted by due date
    sched.sort((a,b)=> a.due_date.localeCompare(b.due_date));
    const schedBody = document.getElementById("schedBody");

    // Track cumulative due per plot for status
    const cumulativeDue = {};
    schedBody.innerHTML = sched.map(s => {
      cumulativeDue[s.plot_id] = (cumulativeDue[s.plot_id] || 0) + s.due_amount;
      const paid = paidByPlot[s.plot_id] || 0;
      const status = paid >= cumulativeDue[s.plot_id] ? "Paid" : "Pending";
      const plot = plots.find(p => p.id === s.plot_id);
      return `
        <tr>
          <td>${s.n}</td>
          <td><strong>${plot?.plot || "-"}</strong></td>
          <td>${s.due_date}</td>
          <td class="right">${money(s.due_amount)}</td>
          <td>${status}</td>
        </tr>
      `;
    }).join("") || `<tr><td colspan="5">No schedule available.</td></tr>`;
  </script>
</body>
</html>
