<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Plots</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sbBrand">
      <div class="sbLogo">GV</div>
      <div><div class="sbTitle">Golden Valley</div><div class="sbSub">Admin Portal</div></div>
    </div>

    <nav class="sbNav">
      <a class="sbLink" href="index.html">Dashboard</a>
      <a class="sbLink active" href="plots.html">Plots</a>
      <a class="sbLink" href="users.html">Users</a>
      <a class="sbLink" href="payments.html">Payments</a>
      <a class="sbLink" href="payment-summary.html">Payment Summary</a>
    </nav>

    <div class="sbFoot">
      <button class="btn ghost" id="btnLogout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="pageTop">
      <h1>Plots</h1>
    </header>

    <section class="card">
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Plot</th>
              <th>Total Price</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { requireRole, wireLogout } from "./auth.js";
import { supabase } from "./db.js";

await requireRole(["admin"]);
wireLogout();

await supabase.rpc("update_plot_payment_status");

const { data: plots } = await supabase
  .from("plots")
  .select("*")
  .order("plot");

function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

const tbody = document.getElementById("tbody");

tbody.innerHTML = plots.map(p=>`
  <tr class="${p.payment_status}">
    <td><strong>${p.plot}</strong></td>
    <td>${money(p.total_price)}</td>
    <td>
      <span class="badge ${p.payment_status}">
        ${p.payment_status}
      </span>
    </td>
  </tr>
`).join("");
</script>
</body>
</html>
