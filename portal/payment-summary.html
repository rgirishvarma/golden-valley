<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payment Summary</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sbBrand">
      <div class="sbLogo">GV</div>
      <div>
        <div class="sbTitle">Golden Valley</div>
        <div class="sbSub">Admin Portal</div>
      </div>
    </div>

    <nav class="sbNav">
      <a class="sbLink" href="index.html">Dashboard</a>
      <a class="sbLink" href="plots.html">Plots</a>
      <a class="sbLink" href="users.html">Users</a>
      <a class="sbLink" href="payments.html">Payments</a>
      <a class="sbLink active" href="payment-summary.html">Payment Summary</a>
      <a class="sbLink" href="installment-plans.html">Installment Plans</a>
    </nav>

    <div class="sbFoot">
      <button class="btn ghost" id="btnLogout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="pageTop">
      <h1>Payment Summary</h1>
      <div class="actions">
        <button class="btn" id="btnExport">Export Excel</button>
      </div>
    </header>

    <section class="card">
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Plot</th>
              <th>Customer</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th class="right">Total Price</th>
              <th class="right">Total Paid</th>
              <th class="right">Balance</th>
              <th>Last Paid Date</th>
              <th class="right">WhatsApp</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { requireRole, wireLogout } from "./auth.js";
import { supabase } from "./db.js";

await requireRole(["admin"]);
wireLogout();

function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

// refresh status
await supabase.rpc("update_plot_payment_status");

// view
const { data: summary, error: sumErr } = await supabase
  .from("admin_financial_summary")
  .select("*");
if (sumErr) { alert(sumErr.message); throw sumErr; }

// plots (for payment_status)
const { data: plots, error: pErr } = await supabase
  .from("plots")
  .select("id,plot,payment_status")
  .order("plot");
if (pErr) { alert(pErr.message); throw pErr; }

const plotById = new Map((plots||[]).map(p => [p.id, p]));

// customers
const { data: customers, error: cErr } = await supabase
  .from("customers")
  .select("id,user_name,user_email,phone,address");
if (cErr) { alert(cErr.message); throw cErr; }

const custById = new Map((customers||[]).map(c => [c.id, c]));

const rows = (summary||[]).map(s => {
  const pl = plotById.get(s.plot_id);
  const ps = pl?.payment_status || "active";
  const c = s.customer_id ? custById.get(s.customer_id) : null;

  return {
    plot: s.plot,
    payment_status: ps,
    customer: c?.user_name || "Unassigned",
    email: c?.user_email || "-",
    phone: c?.phone || "-",
    total: Number(s.total_price||0),
    paid: Number(s.total_paid||0),
    balance: Number(s.balance||0),
    lastPaid: s.last_paid_date || "-"
  };
});

const tbody = document.getElementById("tbody");
tbody.innerHTML = rows.map(r => `
  <tr class="${r.payment_status}">
    <td><strong>${r.plot}</strong></td>
    <td>${r.customer}</td>
    <td>${r.email}</td>
    <td>${r.phone}</td>
    <td><span class="badge ${r.payment_status}">${r.payment_status}</span></td>
    <td class="right">${money(r.total)}</td>
    <td class="right">${money(r.paid)}</td>
    <td class="right">${money(r.balance)}</td>
    <td>${r.lastPaid}</td>
    <td class="right">
      ${r.phone && r.balance > 0 ? `
        <button class="btn small ghost"
          data-phone="${r.phone}"
          data-plot="${r.plot}"
          data-bal="${r.balance}">
          WhatsApp
        </button>
      ` : "-"}
    </td>
  </tr>
`).join("") || `<tr><td colspan="10">No data</td></tr>`;

// WhatsApp
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-phone]");
  if (!btn) return;

  const phone = btn.dataset.phone.replace("+","");
  const plot = btn.dataset.plot;
  const bal = btn.dataset.bal;

  const message = encodeURIComponent(
`Golden Valley Payment Reminder

Plot: ${plot}
Remaining Balance: ₹${Number(bal).toLocaleString("en-IN")}

Please complete your payment.
Thank you.`
  );

  window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
});

// Export CSV (Excel)
document.getElementById("btnExport").onclick = () => {
  let csv = "Plot,Customer,Email,Phone,Payment Status,Total Price,Total Paid,Balance,Last Paid Date\n";
  rows.forEach(r=>{
    csv += `"${r.plot}","${r.customer}","${r.email}","${r.phone}","${r.payment_status}",${r.total},${r.paid},${r.balance},"${r.lastPaid}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Payment_Summary.csv";
  a.click();
};
</script>
</body>
</html>
