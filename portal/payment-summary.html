<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payment Summary</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div>
          <div class="sbTitle">Golden Valley</div>
          <div class="sbSub">Admin Portal</div>
        </div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="index.html">Dashboard</a>
        <a class="sbLink" href="plots.html">Plots</a>
        <a class="sbLink" href="users.html">Users</a>
        <a class="sbLink" href="payments.html">Payments</a>
        <a class="sbLink active" href="payment-summary.html">Payment Summary</a>
        <a class="sbLink" href="installment-plans.html">Installment Plans</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Payment Summary</h1>
      </header>

      <section class="card">
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Plot</th>
                <th>User</th>
                <th class="right">Total Price</th>
                <th class="right">Paid</th>
                <th class="right">Balance</th>
                <th class="right">WhatsApp</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPlots, listPayments, listProfiles } from "./db.js";

    await requireRole(["admin"]);
    wireLogout();

    const [plots, payments, users] = await Promise.all([
      listPlots(),
      listPayments(),
      listProfiles()
    ]);

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    const rows = plots.map(pl => {
      const owner = users.find(u => u.id === pl.owner_id);
      const total = Number(pl.total_price || 0);
      const paid = payments
        .filter(p => p.plot_id === pl.id)
        .reduce((s,p)=> s + Number(p.amount||0), 0);
      const bal = Math.max(total - paid, 0);

      return { pl, owner, total, paid, bal };
    });

    const tbody = document.getElementById("tbody");

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td><strong>${r.pl.plot}</strong></td>
        <td>${r.owner?.name || "-"}<br><small>${r.owner?.phone || ""}</small></td>
        <td class="right">${money(r.total)}</td>
        <td class="right">${money(r.paid)}</td>
        <td class="right">${money(r.bal)}</td>
        <td class="right">
          ${r.owner?.phone ? `
            <button class="btn small ghost"
              data-phone="${r.owner.phone}"
              data-plot="${r.pl.plot}"
              data-bal="${r.bal}">
              WhatsApp
            </button>
          ` : "-"}
        </td>
      </tr>
    `).join("");

    // WhatsApp handler
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-phone]");
      if (!btn) return;

      const phone = btn.dataset.phone.replace("+","");
      const plot = btn.dataset.plot;
      const bal = btn.dataset.bal;

      const message = encodeURIComponent(
        `Golden Valley Payment Reminder:\n\nPlot: ${plot}\nRemaining Balance: ₹${Number(bal).toLocaleString("en-IN")}\n\nPlease complete your payment.\nThank you.`
      );

      window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
    });
  </script>
</body>
</html>
