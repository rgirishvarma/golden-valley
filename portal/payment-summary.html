<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Golden Valley • Payment Summary</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div>
          <div class="sbTitle">Golden Valley</div>
          <div class="sbSub">Admin Portal</div>
        </div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="index.html">Dashboard</a>
        <a class="sbLink" href="plots.html">Plots</a>
        <a class="sbLink" href="users.html">Users</a>
        <a class="sbLink" href="payments.html">Payments</a>
        <a class="sbLink active" href="payment-summary.html">Payment Summary</a>
        <a class="sbLink" href="user-home.html">User Home</a>
      </nav>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Payment Summary (Per Plot)</h1>
        <div class="actions">
          <input id="sumSearch" class="input" placeholder="Search plot / owner / phone" />
          <button class="btn ghost" id="btnExportSummary">Export CSV</button>
        </div>
      </header>

      <section class="grid2" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat">
          <div class="statLabel">Total Price</div>
          <div class="statValue" id="stTotalPrice">₹0</div>
        </div>
        <div class="stat">
          <div class="statLabel">Total Paid</div>
          <div class="statValue" id="stPaid">₹0</div>
        </div>
        <div class="stat">
          <div class="statLabel">Total Balance</div>
          <div class="statValue" id="stBal">₹0</div>
        </div>
      </section>

      <section class="card">
        <div class="cardHeader">
          <h2>All plots summary</h2>
        </div>

        <div class="tableWrap">
          <table class="table" id="sumTable">
            <thead>
              <tr>
                <th>Plot</th>
                <th>Status</th>
                <th>Owner</th>
                <th>Phone</th>
                <th class="right">Total Price</th>
                <th class="right">Paid</th>
                <th class="right">Balance</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="portal.js"></script>
  <script>
    const tbody = document.querySelector("#sumTable tbody");
    const search = document.getElementById("sumSearch");

    const stTotalPrice = document.getElementById("stTotalPrice");
    const stPaid = document.getElementById("stPaid");
    const stBal = document.getElementById("stBal");

    function money(n){
      const x = Number(n || 0);
      return "₹" + x.toLocaleString("en-IN");
    }

    function paidForPlot(plotId){
      return payments
        .filter(p => p.plotId === plotId)
        .reduce((sum, p) => sum + Number(p.amount || 0), 0);
    }

    function render(){
      const q = (search.value || "").trim().toLowerCase();

      let totalPrice = 0;
      let totalPaid = 0;

      const rows = plots.map(pl => {
        const owner = users.find(u => u.id === pl.ownerUserId);
        const price = Number(pl.totalPrice || 0);
        const paid = paidForPlot(pl.id);
        const bal = Math.max(price - paid, 0);

        totalPrice += price;
        totalPaid += paid;

        const ownerName = owner?.name || "-";
        const ownerPhone = owner?.phone || "-";

        return {
          pl, ownerName, ownerPhone, price, paid, bal,
          searchText: (pl.plot + " " + ownerName + " " + ownerPhone).toLowerCase()
        };
      })
      .filter(r => r.searchText.includes(q))
      .sort((a,b) => a.pl.plot.localeCompare(b.pl.plot));

      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><strong>${escapeHtml(r.pl.plot)}</strong></td>
          <td>${badgeForStatus(r.pl.status)}</td>
          <td>${escapeHtml(r.ownerName)}</td>
          <td>${escapeHtml(r.ownerPhone)}</td>
          <td class="right">${money(r.price)}</td>
          <td class="right">${money(r.paid)}</td>
          <td class="right">${money(r.bal)}</td>
        </tr>
      `).join("");

      stTotalPrice.textContent = money(totalPrice);
      stPaid.textContent = money(totalPaid);
      stBal.textContent = money(Math.max(totalPrice - totalPaid, 0));
    }

    document.getElementById("btnExportSummary").addEventListener("click", () => {
      const rows = [["Plot","Status","Owner","Phone","TotalPrice","Paid","Balance"]];
      plots.forEach(pl => {
        const owner = users.find(u => u.id === pl.ownerUserId);
        const price = Number(pl.totalPrice || 0);
        const paid = payments.filter(p => p.plotId === pl.id).reduce((s,p) => s + Number(p.amount||0), 0);
        const bal = Math.max(price - paid, 0);
        rows.push([pl.plot, pl.status, owner?.name||"", owner?.phone||"", price, paid, bal]);
      });
      downloadCsv("golden-valley-payment-summary.csv", rows);
    });

    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
