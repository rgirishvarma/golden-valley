<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payment Summary</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sbBrand">
      <div class="sbLogo">GV</div>
      <div>
        <div class="sbTitle">Golden Valley</div>
        <div class="sbSub">Admin Portal</div>
      </div>
    </div>

    <nav class="sbNav">
      <a class="sbLink" href="index.html">Dashboard</a>
      <a class="sbLink" href="plots.html">Plots</a>
      <a class="sbLink" href="users.html">Users</a>
      <a class="sbLink" href="payments.html">Payments</a>
      <a class="sbLink active" href="payment-summary.html">Payment Summary</a>
      <a class="sbLink" href="installment-plans.html">Installment Plans</a>
    </nav>

    <div class="sbFoot">
      <button class="btn ghost" id="btnLogout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="pageTop">
      <h1>Payment Summary</h1>
    </header>

    <section class="card">
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Plot</th>
              <th>Owner</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th class="right">Total Price</th>
              <th class="right">Total Paid</th>
              <th class="right">Balance</th>
              <th>Last Paid Date</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { requireRole, wireLogout } from "./auth.js";
import { supabase } from "./db.js";

await requireRole(["admin"]);
wireLogout();

function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

// Refresh statuses
await supabase.rpc("update_plot_payment_status");

// Get plots
const { data: plots } = await supabase
  .from("plots")
  .select("id,plot,total_price,payment_status");

// Assignments
const { data: assigns } = await supabase
  .from("plot_assignments")
  .select("plot_id,user_id");

// Profiles
const { data: profiles } = await supabase
  .from("profiles")
  .select("id,name,phone,email");

// Payments (to calculate total + last paid date)
const { data: payments } = await supabase
  .from("payments")
  .select("plot_id,amount,pay_date");

const profileById = new Map((profiles||[]).map(p => [p.id, p]));

// Group payments by plot
const paymentMap = {};
(payments || []).forEach(p => {
  if (!paymentMap[p.plot_id]) {
    paymentMap[p.plot_id] = {
      total: 0,
      lastDate: null
    };
  }

  paymentMap[p.plot_id].total += Number(p.amount || 0);

  if (!paymentMap[p.plot_id].lastDate || 
      new Date(p.pay_date) > new Date(paymentMap[p.plot_id].lastDate)) {
    paymentMap[p.plot_id].lastDate = p.pay_date;
  }
});

const tbody = document.getElementById("tbody");

tbody.innerHTML = (plots || []).map(pl => {
  const asg = assigns.find(a => a.plot_id === pl.id);
  const owner = asg ? profileById.get(asg.user_id) : null;

  const totalPaid = paymentMap[pl.id]?.total || 0;
  const lastPaid = paymentMap[pl.id]?.lastDate || "-";
  const balance = Math.max(Number(pl.total_price||0) - totalPaid, 0);

  return `
    <tr class="${pl.payment_status || 'active'}">
      <td><strong>${pl.plot}</strong></td>
      <td>${owner?.name || "Unassigned"}</td>
      <td>${owner?.email || "-"}</td>
      <td>${owner?.phone || "-"}</td>
      <td><span class="badge ${pl.payment_status || 'active'}">${pl.payment_status || 'active'}</span></td>
      <td class="right">${money(pl.total_price)}</td>
      <td class="right">${money(totalPaid)}</td>
      <td class="right">${money(balance)}</td>
      <td>${lastPaid}</td>
    </tr>
  `;
}).join("") || `<tr><td colspan="9">No data available</td></tr>`;
</script>
</body>
</html>
