<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payments</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sbBrand">
      <div class="sbLogo">GV</div>
      <div><div class="sbTitle">Golden Valley</div><div class="sbSub">Admin Portal</div></div>
    </div>

    <nav class="sbNav">
      <a class="sbLink" href="index.html">Dashboard</a>
      <a class="sbLink" href="plots.html">Plots</a>
      <a class="sbLink" href="users.html">Users</a>
      <a class="sbLink active" href="payments.html">Payments</a>
      <a class="sbLink" href="payment-summary.html">Payment Summary</a>
      <a class="sbLink" href="installment-plans.html">Installment Plans</a>
    </nav>

    <div class="sbFoot">
      <button class="btn ghost" id="btnLogout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="pageTop">
      <h1>Payments</h1>
      <div class="actions">
        <button class="btn" id="btnAdd">+ Add Payment</button>
      </div>
    </header>

    <section class="card">
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th>Plot</th>
              <th class="right">Amount</th>
              <th>Mode</th>
              <th>Note</th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="modal hidden" id="modal">
  <div class="modalBox">
    <div class="modalTitle" id="mtitle">Payment</div>
    <div id="mbody"></div>
    <div class="modalActions">
      <button class="btn ghost" id="mcancel">Cancel</button>
      <button class="btn" id="mok">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { requireRole, wireLogout } from "./auth.js";
import { supabase } from "./db.js";

await requireRole(["admin"]);
wireLogout();

const tbody = document.getElementById("tbody");
const modal = document.getElementById("modal");
const mtitle = document.getElementById("mtitle");
const mbody = document.getElementById("mbody");
const mcancel = document.getElementById("mcancel");
const mok = document.getElementById("mok");

function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }
function openModal(title, html, onSave){
  mtitle.textContent = title;
  mbody.innerHTML = html;
  modal.classList.remove("hidden");
  mok.onclick = async () => { await onSave(); modal.classList.add("hidden"); await refresh(); };
  mcancel.onclick = () => modal.classList.add("hidden");
}

let customers = [], plots = [], assignments = [], payments = [];

async function refresh(){
  const [c, p, a, pay] = await Promise.all([
    supabase.from("customers").select("id,user_name,user_email,phone").order("user_name"),
    supabase.from("plots").select("id,plot").order("plot"),
    supabase.from("plot_assignments").select("plot_id,customer_id"),
    supabase.from("payments").select("*").order("pay_date", { ascending:false })
  ]);

  if (c.error) throw c.error;
  if (p.error) throw p.error;
  if (a.error) throw a.error;
  if (pay.error) throw pay.error;

  customers = c.data || [];
  plots = p.data || [];
  assignments = a.data || [];
  payments = pay.data || [];

  const custById = new Map(customers.map(x=>[x.id,x]));
  const plotById = new Map(plots.map(x=>[x.id,x]));

  tbody.innerHTML = payments.map(pm => {
    const cust = custById.get(pm.customer_id);
    const plot = plotById.get(pm.plot_id);
    return `
      <tr>
        <td>${pm.pay_date}</td>
        <td>${cust?.user_name || "-"}<br><small>${cust?.user_email||""}</small></td>
        <td><strong>${plot?.plot || "-"}</strong></td>
        <td class="right">${money(pm.amount)}</td>
        <td>${pm.mode || "-"}</td>
        <td>${pm.note || "-"}</td>
        <td class="right">
          <button class="btn small ghost" data-edit="${pm.id}">Edit</button>
          <button class="btn small ghost" data-del="${pm.id}">Delete</button>
        </td>
      </tr>
    `;
  }).join("") || `<tr><td colspan="7">No payments</td></tr>`;
}

function customerOptions(){
  return customers.map(c => `
    <option value="${c.id}">${c.user_name} • ${c.user_email}</option>
  `).join("");
}

function plotsAssignedToCustomer(customerId){
  const plotIds = assignments.filter(a => a.customer_id === customerId).map(a => a.plot_id);
  return plots.filter(p => plotIds.includes(p.id));
}

function plotOptionsForCustomer(customerId){
  const list = plotsAssignedToCustomer(customerId);
  if (!list.length) return `<option value="">No assigned plots</option>`;
  return list.map(p => `<option value="${p.id}">${p.plot}</option>`).join("");
}

document.getElementById("btnAdd").onclick = () => {
  openModal("Add Payment", `
    <div class="field"><label>Customer</label>
      <select id="c">${customerOptions()}</select>
    </div>

    <div class="field"><label>Assigned Plot</label>
      <select id="p"></select>
      <div class="help" style="font-size:12px;color:#666;">Only plots assigned to selected customer are shown.</div>
    </div>

    <div class="field"><label>Date</label><input id="d" type="date" /></div>
    <div class="field"><label>Amount</label><input id="a" type="number" min="1" /></div>
    <div class="field"><label>Mode</label><input id="m" placeholder="cash/upi/bank" /></div>
    <div class="field"><label>Note</label><input id="n" placeholder="optional" /></div>
  `, async () => {
    const customer_id = document.getElementById("c").value;
    const plot_id = document.getElementById("p").value;

    const row = {
      customer_id,
      plot_id,
      pay_date: document.getElementById("d").value,
      amount: Number(document.getElementById("a").value||0),
      mode: document.getElementById("m").value.trim(),
      note: document.getElementById("n").value.trim()
    };

    if (!row.customer_id) return alert("Select customer");
    if (!row.plot_id) return alert("No plot selected (customer has no assigned plot)");
    if (!row.pay_date) return alert("Select date");
    if (!(row.amount>0)) return alert("Enter amount");

    const res = await supabase.from("payments").insert(row);
    if (res.error) return alert(res.error.message);

    await supabase.rpc("update_plot_payment_status");
  });

  const custSel = document.getElementById("c");
  const plotSel = document.getElementById("p");

  const refreshPlots = () => {
    plotSel.innerHTML = plotOptionsForCustomer(custSel.value);
  };

  custSel.addEventListener("change", refreshPlots);
  refreshPlots();
};

document.addEventListener("click", async (e)=>{
  const edit = e.target.closest("button[data-edit]");
  const del = e.target.closest("button[data-del]");

  if (edit){
    const id = edit.dataset.edit;
    const pm = payments.find(x=>x.id===id);
    if (!pm) return;

    openModal("Edit Payment", `
      <div class="help" style="color:#666;">Customer/Plot cannot be changed here. Delete and re-add if needed.</div>
      <div class="field"><label>Date</label><input id="d" type="date" value="${pm.pay_date||""}" /></div>
      <div class="field"><label>Amount</label><input id="a" type="number" min="1" value="${pm.amount||0}" /></div>
      <div class="field"><label>Mode</label><input id="m" value="${pm.mode||""}" /></div>
      <div class="field"><label>Note</label><input id="n" value="${pm.note||""}" /></div>
    `, async ()=>{
      const upd = {
        pay_date: document.getElementById("d").value,
        amount: Number(document.getElementById("a").value||0),
        mode: document.getElementById("m").value.trim(),
        note: document.getElementById("n").value.trim()
      };

      const res = await supabase.from("payments").update(upd).eq("id", id);
      if (res.error) return alert(res.error.message);

      await supabase.rpc("update_plot_payment_status");
    });
  }

  if (del){
    const id = del.dataset.del;
    if (!confirm("Delete this payment?")) return;

    const res = await supabase.from("payments").delete().eq("id", id);
    if (res.error) return alert(res.error.message);

    await supabase.rpc("update_plot_payment_status");
    await refresh();
  }
});

await refresh();
</script>
</body>
</html>
