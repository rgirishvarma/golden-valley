<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Plots</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="user-home.html">User Home</a>
        <a class="sbLink active" href="user.html">My Plots</a>
        <a class="sbLink" href="my-payments.html">My Payments</a>
        <a class="sbLink" href="profile.html">Profile</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>My Plots</h1>
      </header>

      <section class="card">
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Plot</th>
                <th>Status</th>
                <th>Location</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPlots } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();

    if (profile.role === "admin") {
      window.location.href = "./index.html";
    }

    const plots = await listPlots();
    const tbody = document.getElementById("tbody");

    tbody.innerHTML = plots.map(p => `
      <tr>
        <td><strong>${p.plot}</strong></td>
        <td>${p.status}</td>
        <td>${p.location || "-"}</td>
        <td>${p.notes || "-"}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
