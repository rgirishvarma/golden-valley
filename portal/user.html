<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Golden Valley • My Plots</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="user-home.html">User Home</a>
        <a class="sbLink active" href="user.html">My Plots</a>
        <a class="sbLink" href="my-payments.html">My Payments</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>My Assigned Plots</h1>
        <div class="actions" id="who"></div>
      </header>

      <section class="card">
        <div class="cardHeader"><h2>Plot details</h2></div>
        <div class="tableWrap">
          <table class="table" id="tbl">
            <thead><tr><th>Plot</th><th>Status</th><th>Location</th><th>Notes</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPlots } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();
    document.getElementById("who").textContent = `${profile.name || "User"} (${profile.phone || ""})`;

    const plots = await listPlots(); // RLS returns only assigned plots
    const tbody = document.querySelector("#tbl tbody");

    tbody.innerHTML = plots.map(p => `
      <tr>
        <td><strong>${p.plot}</strong></td>
        <td>${p.status}</td>
        <td>${p.location || "-"}</td>
        <td>${p.notes || "-"}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
