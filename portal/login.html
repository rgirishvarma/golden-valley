<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden Valley Login</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <main class="container" style="max-width:520px;margin-top:40px;">
    <section class="card">
      <div class="cardHeader">
        <h2>Login</h2>
      </div>

      <div style="padding:14px;display:grid;gap:10px;">

        <!-- Toggle Buttons -->
        <div style="display:flex;gap:10px;">
          <button class="btn ghost" id="btnEmailMode">Email Login</button>
          <button class="btn ghost" id="btnPhoneMode">Mobile OTP</button>
        </div>

        <!-- EMAIL LOGIN -->
        <div id="emailBox">
          <div class="field">
            <label>Email</label>
            <input id="email" class="input" placeholder="admin@email.com" />
          </div>

          <div class="field">
            <label>Password</label>
            <input id="password" type="password" class="input" />
          </div>

          <button class="btn" id="btnEmailLogin" style="width:100%;">
            Login with Email
          </button>
        </div>

        <!-- PHONE OTP LOGIN -->
        <div id="phoneBox" style="display:none;">
          <div class="field">
            <label>Phone (+country code)</label>
            <input id="phone" class="input" placeholder="+91XXXXXXXXXX" />
          </div>

          <button class="btn" id="btnSendOtp" style="width:100%;">
            Send OTP
          </button>

          <div id="otpArea" style="display:none;">
            <div class="field">
              <label>Enter OTP</label>
              <input id="otp" class="input" />
            </div>

            <button class="btn" id="btnVerifyOtp" style="width:100%;">
              Verify OTP
            </button>
          </div>

          <div class="help" style="font-size:13px;color:#666;">
            ⚠ If OTP says <b>“Signups not allowed for otp”</b>,  
            please login once with Email and link your phone.
          </div>
        </div>

        <div class="help" id="msg" style="color:#c0392b;"></div>

      </div>
    </section>
  </main>

  <script type="module">
    import { supabase } from "./db.js";
    import { getMyProfile } from "./db.js";

    const msg = document.getElementById("msg");
    const emailBox = document.getElementById("emailBox");
    const phoneBox = document.getElementById("phoneBox");
    const otpArea = document.getElementById("otpArea");

    function setMsg(t){ msg.textContent = t || ""; }

    // Toggle Modes
    document.getElementById("btnEmailMode").onclick = () => {
      emailBox.style.display = "block";
      phoneBox.style.display = "none";
      otpArea.style.display = "none";
      setMsg("");
    };

    document.getElementById("btnPhoneMode").onclick = () => {
      emailBox.style.display = "none";
      phoneBox.style.display = "block";
      setMsg("");
    };

    // EMAIL LOGIN
    document.getElementById("btnEmailLogin").onclick = async () => {
      setMsg("");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        setMsg(error.message);
        return;
      }

      redirectAfterLogin();
    };

    // SEND OTP
    document.getElementById("btnSendOtp").onclick = async () => {
      setMsg("");
      const phone = document.getElementById("phone").value.trim();

      if (!phone.startsWith("+")) {
        setMsg("Use format +91XXXXXXXXXX");
        return;
      }

      const { error } = await supabase.auth.signInWithOtp({
        phone,
        options: { shouldCreateUser: false } // important
      });

      if (error) {
        if (error.message.includes("Signups not allowed")) {
          setMsg("Phone not linked to any account. Please login with Email once and link your phone.");
        } else {
          setMsg(error.message);
        }
        return;
      }

      otpArea.style.display = "block";
      setMsg("OTP sent ✅");
    };

    // VERIFY OTP
    document.getElementById("btnVerifyOtp").onclick = async () => {
      setMsg("");
      const phone = document.getElementById("phone").value.trim();
      const token = document.getElementById("otp").value.trim();

      const { error } = await supabase.auth.verifyOtp({
        phone,
        token,
        type: "sms"
      });

      if (error) {
        setMsg(error.message);
        return;
      }

      redirectAfterLogin();
    };

    async function redirectAfterLogin() {
      const profile = await getMyProfile();

      if (!profile) {
        setMsg("Profile not found. Contact admin.");
        return;
      }

      if (profile.role === "admin") {
        window.location.href = "./index.html";
      } else {
        window.location.href = "./user-home.html";
      }
    }

    // If already logged in
    const { data } = await supabase.auth.getUser();
    if (data.user) {
      redirectAfterLogin();
    }
  </script>
</body>
</html>
