<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sbBrand">
      <div class="sbLogo">GV</div>
      <div>
        <div class="sbTitle">Golden Valley</div>
        <div class="sbSub">Admin Portal</div>
      </div>
    </div>

    <nav class="sbNav">
      <a class="sbLink active" href="index.html">Dashboard</a>
      <a class="sbLink" href="plots.html">Plots</a>
      <a class="sbLink" href="users.html">Users</a>
      <a class="sbLink" href="payments.html">Payments</a>
      <a class="sbLink" href="payment-summary.html">Payment Summary</a>
      <a class="sbLink" href="installment-plans.html">Installment Plans</a>
    </nav>

    <div class="sbFoot">
      <button class="btn ghost" id="btnLogout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="pageTop">
      <h1>Admin Financial Dashboard</h1>
    </header>

    <section class="grid2" style="grid-template-columns: repeat(4,1fr);">
      <div class="stat">
        <div class="statLabel">Total Revenue</div>
        <div class="statValue" id="stRevenue">₹0</div>
      </div>
      <div class="stat">
        <div class="statLabel">Total Collected</div>
        <div class="statValue" id="stCollected">₹0</div>
      </div>
      <div class="stat">
        <div class="statLabel">Total Outstanding</div>
        <div class="statValue" id="stOutstanding">₹0</div>
      </div>
      <div class="stat">
        <div class="statLabel">Overdue / Delayed</div>
        <div class="statValue" id="stOverdueCount">0</div>
      </div>
    </section>

    <section class="card" style="margin-top:20px;">
      <div class="cardHeader"><h2>Delayed / Overdue Plots</h2></div>
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Plot</th>
              <th>Status</th>
              <th class="right">Balance</th>
            </tr>
          </thead>
          <tbody id="overdueBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { requireRole, wireLogout } from "./auth.js";
import { supabase } from "./db.js";

await requireRole(["admin"]);
wireLogout();

function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

// 🔥 Auto update status every time dashboard loads
await supabase.rpc("update_plot_payment_status");

// Fetch summary
const { data: summary } = await supabase
  .from("admin_financial_summary")
  .select("*");

let totalRevenue = 0;
let totalCollected = 0;
let totalOutstanding = 0;
let overdueCount = 0;

summary.forEach(r=>{
  totalRevenue += Number(r.total_price||0);
  totalCollected += Number(r.total_paid||0);
  totalOutstanding += Number(r.balance||0);
});

document.getElementById("stRevenue").textContent = money(totalRevenue);
document.getElementById("stCollected").textContent = money(totalCollected);
document.getElementById("stOutstanding").textContent = money(totalOutstanding);

// Fetch plots for status
const { data: plots } = await supabase
  .from("plots")
  .select("id,plot,payment_status,total_price");

const overduePlots = [];

for (const p of plots) {
  if (p.payment_status === "overdue" || p.payment_status === "delayed") {
    overdueCount++;
    const summaryRow = summary.find(s=>s.plot_id === p.id);
    overduePlots.push({
      plot: p.plot,
      status: p.payment_status,
      balance: summaryRow?.balance || 0
    });
  }
}

document.getElementById("stOverdueCount").textContent = overdueCount;

const tbody = document.getElementById("overdueBody");
tbody.innerHTML = overduePlots.map(p=>`
  <tr class="${p.status}">
    <td><strong>${p.plot}</strong></td>
    <td><span class="badge ${p.status}">${p.status}</span></td>
    <td class="right">${money(p.balance)}</td>
  </tr>
`).join("") || `<tr><td colspan="3">No overdue accounts 🎉</td></tr>`;
</script>
</body>
</html>
