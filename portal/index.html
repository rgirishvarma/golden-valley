<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">Admin Portal</div></div>
      </div>
      <nav class="sbNav">
        <a class="sbLink active" href="index.html">Dashboard</a>
        <a class="sbLink" href="plots.html">Plots</a>
        <a class="sbLink" href="users.html">Users</a>
        <a class="sbLink" href="payments.html">Payments</a>
        <a class="sbLink" href="payment-summary.html">Payment Summary</a>
        <a class="sbLink" href="installment-plans.html">Installment Plans</a>
      </nav>
      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Admin Financial Dashboard</h1>
      </header>

      <section class="grid2" style="grid-template-columns: repeat(5,1fr);">
        <div class="stat">
          <div class="statLabel">Total Revenue</div>
          <div class="statValue" id="stRevenue">₹0</div>
        </div>
        <div class="stat">
          <div class="statLabel">Total Collected</div>
          <div class="statValue" id="stCollected">₹0</div>
        </div>
        <div class="stat">
          <div class="statLabel">Total Outstanding</div>
          <div class="statValue" id="stOutstanding">₹0</div>
        </div>
        <div class="stat">
          <div class="statLabel">Overdue Amount</div>
          <div class="statValue" id="stOverdue">₹0</div>
        </div>
        <div class="stat">
          <div class="statLabel">Overdue Customers</div>
          <div class="statValue" id="stOverdueCount">0</div>
        </div>
      </section>

      <section class="card" style="margin-top:14px;">
        <div class="cardHeader"><h2>Overdue List</h2></div>
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Plot</th>
                <th>User</th>
                <th class="right">Balance</th>
              </tr>
            </thead>
            <tbody id="overdueBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

<script type="module">
import { requireRole, wireLogout } from "./auth.js";
import { supabase } from "./db.js";

await requireRole(["admin"]);
wireLogout();

function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

// Fetch summary view
const { data: summary } = await supabase
  .from("admin_financial_summary")
  .select("*");

let totalRevenue = 0;
let totalCollected = 0;
let totalOutstanding = 0;

summary.forEach(r=>{
  totalRevenue += Number(r.total_price||0);
  totalCollected += Number(r.total_paid||0);
  totalOutstanding += Number(r.balance||0);
});

document.getElementById("stRevenue").textContent = money(totalRevenue);
document.getElementById("stCollected").textContent = money(totalCollected);
document.getElementById("stOutstanding").textContent = money(totalOutstanding);

// -------- Overdue Logic --------
// Basic rule: balance > 0 AND at least 1 installment past start_date

const { data: plans } = await supabase.from("installment_plans").select("*");
const { data: users } = await supabase.from("profiles").select("*");

const today = new Date();
let overdueAmount = 0;
let overdueCustomers = new Set();

const overdueRows = [];

for (const plan of plans) {
  const plot = summary.find(s=>s.plot_id === plan.plot_id);
  if (!plot) continue;

  const start = new Date(plan.start_date);
  const monthsPassed = (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth());

  const dueMonths = Math.min(monthsPassed+1, plan.installments_count);
  const cumulativeDue = dueMonths * Number(plan.installment_amount||0);

  if (plot.total_paid < cumulativeDue && plot.balance > 0) {
    overdueAmount += Number(plot.balance);
    overdueCustomers.add(plan.user_id);

    const user = users.find(u=>u.id===plan.user_id);
    overdueRows.push({
      plot: plot.plot,
      user: user?.name || "",
      balance: plot.balance
    });
  }
}

document.getElementById("stOverdue").textContent = money(overdueAmount);
document.getElementById("stOverdueCount").textContent = overdueCustomers.size;

const tbody = document.getElementById("overdueBody");
tbody.innerHTML = overdueRows.map(r=>`
  <tr style="background:#ffe6e6;">
    <td><strong>${r.plot}</strong></td>
    <td>${r.user}</td>
    <td class="right">${money(r.balance)}</td>
  </tr>
`).join("") || `<tr><td colspan="3">No overdue accounts 🎉</td></tr>`;
</script>
</body>
</html>
