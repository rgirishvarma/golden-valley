<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Golden Valley • Admin Dashboard</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div>
          <div class="sbTitle">Golden Valley</div>
          <div class="sbSub">Admin Portal</div>
        </div>
      </div>

      <nav class="sbNav">
        <a class="sbLink active" href="index.html">Dashboard</a>
        <a class="sbLink" href="plots.html">Plots</a>
        <a class="sbLink" href="users.html">Users</a>
        <a class="sbLink" href="payments.html">Payments</a>
        <a class="sbLink" href="payment-summary.html">Payment Summary</a>
        <a class="sbLink" href="user-home.html">User Home</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Dashboard</h1>
        <div class="actions"></div>
      </header>

      <section class="grid2">
        <div class="stat"><div class="statLabel">Total plots</div><div class="statValue" id="stTotalPlots">0</div></div>
        <div class="stat"><div class="statLabel">Assigned plots</div><div class="statValue" id="stAssignedPlots">0</div></div>
        <div class="stat"><div class="statLabel">Available plots</div><div class="statValue" id="stAvailablePlots">0</div></div>
        <div class="stat"><div class="statLabel">Users</div><div class="statValue" id="stUsers">0</div></div>
      </section>

      <section class="card">
        <div class="cardHeader"><h2>Recent plots</h2></div>
        <div class="tableWrap">
          <table class="table" id="plotsTable">
            <thead>
              <tr><th>Plot</th><th>Status</th><th>Location</th><th class="right">Total Price</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPlots, listProfiles } from "./db.js";

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    await requireRole(["admin"]);
    wireLogout();

    const plots = await listPlots();
    const profiles = await listProfiles();

    const total = plots.length;
    const assigned = plots.filter(p => String(p.status).toLowerCase() === "assigned").length;
    const available = plots.filter(p => String(p.status).toLowerCase() === "available").length;

    document.getElementById("stTotalPlots").textContent = total;
    document.getElementById("stAssignedPlots").textContent = assigned;
    document.getElementById("stAvailablePlots").textContent = available;
    document.getElementById("stUsers").textContent = profiles.length;

    const tbody = document.querySelector("#plotsTable tbody");
    tbody.innerHTML = plots.slice(0, 10).map(p => `
      <tr>
        <td><strong>${p.plot}</strong></td>
        <td>${p.status}</td>
        <td>${p.location || "-"}</td>
        <td class="right">${money(p.total_price)}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
