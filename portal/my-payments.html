<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Payments</title>
  <link rel="stylesheet" href="portal.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="user-home.html">User Home</a>
        <a class="sbLink" href="user.html">My Plots</a>
        <a class="sbLink active" href="my-payments.html">My Payments</a>
        <a class="sbLink" href="installments.html">Installments</a>
        <a class="sbLink" href="profile.html">Profile</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>My Payments</h1>
        <div class="actions" id="who"></div>
      </header>

      <section class="card">
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Plot</th>
                <th class="right">Amount</th>
                <th>Mode</th>
                <th>Note</th>
                <th class="right">Receipt</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPayments, listPlots } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();
    if (profile.role === "admin") window.location.href = "./index.html";

    document.getElementById("who").textContent = profile.name || "User";

    const [payments, plots] = await Promise.all([
      listPayments(),
      listPlots()
    ]);

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    const tbody = document.getElementById("tbody");

    tbody.innerHTML = payments.map(p => {
      const plot = plots.find(pl => pl.id === p.plot_id);
      return `
        <tr>
          <td>${p.pay_date}</td>
          <td><strong>${plot?.plot || "-"}</strong></td>
          <td class="right">${money(p.amount)}</td>
          <td>${p.mode || "-"}</td>
          <td>${p.note || "-"}</td>
          <td class="right">
            <button class="btn small ghost" data-receipt="${p.id}">Download</button>
          </td>
        </tr>
      `;
    }).join("");

    function generateReceipt(payment) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const plot = plots.find(pl => pl.id === payment.plot_id);
      const totalPrice = Number(plot?.total_price || 0);

      const totalPaid = payments
        .filter(x => x.plot_id === payment.plot_id)
        .reduce((s,x)=> s + Number(x.amount||0), 0);

      const balance = Math.max(totalPrice - totalPaid, 0);

      doc.setFontSize(16);
      doc.text("Golden Valley - Payment Receipt", 14, 20);

      doc.setFontSize(11);
      doc.text(`Receipt ID: ${payment.id.slice(0,8).toUpperCase()}`, 14, 32);
      doc.text(`Date: ${payment.pay_date}`, 14, 40);

      doc.text(`Name: ${profile.name || ""}`, 14, 50);
      doc.text(`Phone: ${profile.phone || ""}`, 14, 58);

      doc.text(`Plot: ${plot?.plot || ""}`, 14, 68);
      doc.text(`Mode: ${payment.mode || "-"}`, 14, 76);
      doc.text(`Note: ${payment.note || "-"}`, 14, 84);

      doc.setFontSize(12);
      doc.text(`Amount Paid: ₹${Number(payment.amount).toLocaleString("en-IN")}`, 14, 100);

      doc.setFontSize(11);
      doc.text(`Total Price: ₹${totalPrice.toLocaleString("en-IN")}`, 14, 112);
      doc.text(`Total Paid: ₹${totalPaid.toLocaleString("en-IN")}`, 14, 120);
      doc.text(`Remaining Balance: ₹${balance.toLocaleString("en-IN")}`, 14, 128);

      doc.text("Thank you for your payment!", 14, 145);

      doc.save(`Receipt_${plot?.plot}_${payment.pay_date}.pdf`);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-receipt]");
      if (!btn) return;

      const payment = payments.find(p => p.id === btn.dataset.receipt);
      if (payment) generateReceipt(payment);
    });
  </script>
</body>
</html>
