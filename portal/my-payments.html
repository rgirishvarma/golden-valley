<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Payments</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="user-home.html">User Home</a>
        <a class="sbLink" href="user.html">My Plots</a>
        <a class="sbLink active" href="my-payments.html">My Payments</a>
        <a class="sbLink" href="profile.html">Profile</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>My Payments</h1>
      </header>

      <section class="card">
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Plot</th>
                <th class="right">Amount</th>
                <th>Mode</th>
                <th>Note</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPayments, listPlots } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();

    if (profile.role === "admin") {
      window.location.href = "./index.html";
    }

    const payments = await listPayments();
    const plots = await listPlots();
    const tbody = document.getElementById("tbody");

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    const sorted = payments.sort((a,b)=> new Date(b.pay_date) - new Date(a.pay_date));

    tbody.innerHTML = sorted.map(p => {
      const plot = plots.find(pl => pl.id === p.plot_id);
      return `
        <tr>
          <td>${p.pay_date}</td>
          <td><strong>${plot?.plot || "-"}</strong></td>
          <td class="right">${money(p.amount)}</td>
          <td>${p.mode || "-"}</td>
          <td>${p.note || "-"}</td>
        </tr>
      `;
    }).join("");
  </script>
</body>
</html>
