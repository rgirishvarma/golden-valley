<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Golden Valley • User Home</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink active" href="user-home.html">User Home</a>
        <a class="sbLink" href="user.html">My Plots</a>
        <a class="sbLink" href="my-payments.html">My Payments</a>
        <a class="sbLink" href="installments.html">Installments</a>
        <a class="sbLink" href="profile.html">Profile</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>User Dashboard</h1>
        <div class="actions" id="who"></div>
      </header>

      <section class="grid2" style="grid-template-columns: repeat(4, 1fr);">
        <div class="stat"><div class="statLabel">Assigned Plots</div><div class="statValue" id="stPlots">0</div></div>
        <div class="stat"><div class="statLabel">Total Price</div><div class="statValue" id="stTotal">₹0</div></div>
        <div class="stat"><div class="statLabel">Total Paid</div><div class="statValue" id="stPaid">₹0</div></div>
        <div class="stat"><div class="statLabel">Remaining</div><div class="statValue" id="stBal">₹0</div></div>
      </section>

      <section class="card">
        <div class="cardHeader"><h2>My Plots</h2></div>
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Plot</th>
                <th>Status</th>
                <th>Payment Status</th>
                <th>Location</th>
                <th class="right">Total</th>
                <th class="right">Paid</th>
                <th class="right">Balance</th>
              </tr>
            </thead>
            <tbody id="plotBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { listPlots, listPayments } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();
    if (profile.role === "admin") window.location.href = "./index.html";

    document.getElementById("who").textContent = profile.name || "User";

    const plots = await listPlots();       // includes payment_status
    const payments = await listPayments(); // only own due to RLS

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    let totalPrice = 0, totalPaid = 0;

    const tbody = document.getElementById("plotBody");
    tbody.innerHTML = plots.map(pl => {
      const price = Number(pl.total_price || 0);
      const paid = payments.filter(p => p.plot_id === pl.id)
        .reduce((s,p)=> s + Number(p.amount||0), 0);
      const bal = Math.max(price - paid, 0);

      totalPrice += price;
      totalPaid += paid;

      const ps = pl.payment_status || "active";

      return `
        <tr class="${ps}">
          <td><strong>${pl.plot}</strong></td>
          <td>${pl.status || "-"}</td>
          <td><span class="badge ${ps}">${ps}</span></td>
          <td>${pl.location || "-"}</td>
          <td class="right">${money(price)}</td>
          <td class="right">${money(paid)}</td>
          <td class="right">${money(bal)}</td>
        </tr>
      `;
    }).join("") || `<tr><td colspan="7">No assigned plots</td></tr>`;

    document.getElementById("stPlots").textContent = plots.length;
    document.getElementById("stTotal").textContent = money(totalPrice);
    document.getElementById("stPaid").textContent = money(totalPaid);
    document.getElementById("stBal").textContent = money(totalPrice - totalPaid);
  </script>
</body>
</html>
