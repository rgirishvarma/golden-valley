<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Golden Valley • Profile</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">User Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="user-home.html">User Home</a>
        <a class="sbLink" href="user.html">My Plots</a>
        <a class="sbLink" href="my-payments.html">My Payments</a>
        <a class="sbLink active" href="profile.html">Profile</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Profile</h1>
        <div class="actions" id="who"></div>
      </header>

      <section class="card">
        <div class="cardHeader"><h2>Account</h2></div>
        <div style="padding:14px;display:grid;gap:10px;">
          <div class="help" id="currentInfo"></div>

          <div class="field">
            <label>Link Mobile (+country code)</label>
            <input id="phone" class="input" placeholder="+91XXXXXXXXXX" />
          </div>

          <button class="btn" id="btnSend" style="max-width:240px;">Send OTP</button>

          <div id="otpBox" style="display:none;">
            <div class="field">
              <label>OTP</label>
              <input id="otp" class="input" placeholder="Enter OTP" />
            </div>
            <button class="btn" id="btnVerify" style="max-width:240px;">Verify & Link</button>
          </div>

          <div class="help" id="msg" style="color:#c0392b;"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { supabase, getMyProfile } from "./db.js";

    const { profile } = await requireRole(["user","admin"]);
    wireLogout();

    const who = document.getElementById("who");
    who.textContent = `${profile.name || "User"} (${profile.phone || ""})`;

    const msg = document.getElementById("msg");
    const currentInfo = document.getElementById("currentInfo");
    const otpBox = document.getElementById("otpBox");

    function setMsg(t){ msg.textContent = t || ""; }

    // Admin cannot link phone (admin email-only)
    if (profile.role === "admin") {
      currentInfo.textContent = "Admin account is email-only login. Phone linking is disabled.";
      document.getElementById("phone").disabled = true;
      document.getElementById("btnSend").disabled = true;
    } else {
      const { data } = await supabase.auth.getUser();
      currentInfo.textContent = `Logged in user id: ${data.user?.id || "-"} | Email: ${data.user?.email || "-"} | Phone: ${data.user?.phone || "-"}`;
    }

    document.getElementById("btnSend").onclick = async () => {
      setMsg("");
      const phone = document.getElementById("phone").value.trim();
      if (!phone.startsWith("+")) return setMsg("Use format +91XXXXXXXXXX");

      const { error } = await supabase.auth.updateUser({ phone });
      if (error) return setMsg(error.message);

      otpBox.style.display = "block";
      setMsg("OTP sent ✅ Enter OTP to link phone.");
    };

    document.getElementById("btnVerify").onclick = async () => {
      setMsg("");
      const phone = document.getElementById("phone").value.trim();
      const token = document.getElementById("otp").value.trim();
      if (!token) return setMsg("Enter OTP");

      const { error } = await supabase.auth.verifyOtp({ phone, token, type: "phone_change" });
      if (error) return setMsg(error.message);

      setMsg("Phone linked ✅ Next time you can login using Mobile OTP.");
    };
  </script>
</body>
</html>
