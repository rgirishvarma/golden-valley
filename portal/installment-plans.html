<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Installment Plans</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sbBrand">
        <div class="sbLogo">GV</div>
        <div><div class="sbTitle">Golden Valley</div><div class="sbSub">Admin Portal</div></div>
      </div>

      <nav class="sbNav">
        <a class="sbLink" href="index.html">Dashboard</a>
        <a class="sbLink" href="plots.html">Plots</a>
        <a class="sbLink" href="users.html">Users</a>
        <a class="sbLink" href="payments.html">Payments</a>
        <a class="sbLink" href="payment-summary.html">Payment Summary</a>
        <a class="sbLink active" href="installment-plans.html">Installment Plans</a>
      </nav>

      <div class="sbFoot">
        <button class="btn ghost" id="btnLogout" style="width:100%;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="pageTop">
        <h1>Installment Plans</h1>
        <div class="actions">
          <button class="btn" id="btnAdd">+ Add / Update Plan</button>
        </div>
      </header>

      <section class="card">
        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Plot</th>
                <th>Start</th>
                <th>Freq</th>
                <th class="right">Count</th>
                <th class="right">Amount</th>
                <th class="right">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modalBox">
      <div class="modalTitle" id="mtitle">Plan</div>
      <div id="mbody"></div>
      <div class="modalActions">
        <button class="btn ghost" id="mcancel">Cancel</button>
        <button class="btn" id="mok">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireRole, wireLogout } from "./auth.js";
    import { supabase } from "./db.js";

    await requireRole(["admin"]);
    wireLogout();

    const tbody = document.getElementById("tbody");
    const modal = document.getElementById("modal");
    const mtitle = document.getElementById("mtitle");
    const mbody = document.getElementById("mbody");
    const mcancel = document.getElementById("mcancel");
    const mok = document.getElementById("mok");

    function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

    function openModal(title, html, onSave){
      mtitle.textContent = title;
      mbody.innerHTML = html;
      modal.classList.remove("hidden");
      mok.onclick = async () => { await onSave(); modal.classList.add("hidden"); await refresh(); };
      mcancel.onclick = () => modal.classList.add("hidden");
    }

    let customers = [];
    let plots = [];
    let assignments = [];
    let plans = [];

    async function refresh(){
      const [c, p, a, ip] = await Promise.all([
        supabase.from("customers").select("id,user_name,user_email,phone").order("user_name"),
        supabase.from("plots").select("id,plot,total_price").order("plot"),
        supabase.from("plot_assignments").select("plot_id,customer_id"),
        supabase.from("installment_plans").select("*").order("start_date", { ascending:false })
      ]);

      if (c.error) throw c.error;
      if (p.error) throw p.error;
      if (a.error) throw a.error;
      if (ip.error) throw ip.error;

      customers = c.data || [];
      plots = p.data || [];
      assignments = a.data || [];
      plans = ip.data || [];

      const custById = new Map(customers.map(x=>[x.id,x]));
      const plotById = new Map(plots.map(x=>[x.id,x]));

      tbody.innerHTML = plans.map(pl => {
        const cust = custById.get(pl.customer_id);
        const plot = plotById.get(pl.plot_id);
        return `
          <tr>
            <td>${cust?.user_name || "-"}</td>
            <td>${cust?.user_email || "-"}</td>
            <td>${cust?.phone || "-"}</td>
            <td><strong>${plot?.plot || "-"}</strong></td>
            <td>${pl.start_date}</td>
            <td>${pl.frequency}</td>
            <td class="right">${pl.installments_count}</td>
            <td class="right">${money(pl.installment_amount)}</td>
            <td class="right">
              <button class="btn small ghost" data-del="${pl.id}">Delete</button>
            </td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="9">No plans.</td></tr>`;
    }

    function customerOptions(){
      return customers.map(c => `
        <option value="${c.id}">${c.user_name} • ${c.user_email}</option>
      `).join("");
    }

    function plotsAssignedToCustomer(customerId){
      const plotIds = assignments.filter(a => a.customer_id === customerId).map(a => a.plot_id);
      return plots.filter(p => plotIds.includes(p.id));
    }

    function plotOptionsForCustomer(customerId){
      const list = plotsAssignedToCustomer(customerId);
      if (!list.length) return `<option value="">No assigned plots</option>`;
      return list.map(p=>`<option value="${p.id}">${p.plot}</option>`).join("");
    }

    document.getElementById("btnAdd").onclick = () => {
      openModal("Add / Update Plan", `
        <div class="field"><label>Customer</label>
          <select id="c">${customerOptions()}</select>
        </div>

        <div class="field"><label>Assigned Plot</label>
          <select id="p"></select>
          <div class="help" style="font-size:12px;color:#666;">Only plots assigned to selected customer are shown.</div>
        </div>

        <div class="field"><label>Start Date</label><input id="d" type="date" /></div>

        <div class="field"><label>Frequency</label>
          <select id="f">
            <option value="monthly">monthly</option>
          </select>
        </div>

        <div class="field"><label>Installments Count</label>
          <input id="count" type="number" min="1" value="40" />
          <div class="help" style="font-size:12px;color:#666;">40 months; your final remaining can be handled in schedule display if needed.</div>
        </div>

        <div class="field"><label>Monthly Amount (₹)</label>
          <input id="amt" type="number" min="1" />
        </div>
      `, async () => {
        const customer_id = document.getElementById("c").value;
        const plot_id = document.getElementById("p").value;
        const start_date = document.getElementById("d").value;
        const frequency = document.getElementById("f").value;
        const installments_count = Number(document.getElementById("count").value||0);
        const installment_amount = Number(document.getElementById("amt").value||0);

        if (!customer_id) return alert("Select customer");
        if (!plot_id) return alert("No plot selected (customer has no assigned plot)");
        if (!start_date) return alert("Pick start date");
        if (!(installments_count>0)) return alert("Enter count");
        if (!(installment_amount>0)) return alert("Enter amount");

        // upsert plan (if your table has a unique constraint on customer_id+plot_id, this will behave like update)
        const res = await supabase.from("installment_plans").upsert([{
          customer_id, plot_id, start_date, frequency, installments_count, installment_amount
        }], { onConflict: "customer_id,plot_id" });

        if (res.error) return alert(res.error.message);

        await supabase.rpc("update_plot_payment_status");
      });

      const custSel = document.getElementById("c");
      const plotSel = document.getElementById("p");
      const refreshPlots = () => {
        plotSel.innerHTML = plotOptionsForCustomer(custSel.value);
      };
      custSel.addEventListener("change", refreshPlots);
      refreshPlots();
    };

    document.addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-del]");
      if (!b) return;
      if (!confirm("Delete plan?")) return;

      const res = await supabase.from("installment_plans").delete().eq("id", b.dataset.del);
      if (res.error) return alert(res.error.message);

      await supabase.rpc("update_plot_payment_status");
      await refresh();
    });

    await refresh();
  </script>
</body>
</html>
