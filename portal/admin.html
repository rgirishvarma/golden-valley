<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden Valley Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 10px; min-width: 280px; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px; }
    button { padding: 10px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f5f5f5; }
    .muted { color: #666; font-size: 13px; }
    .error { color: #b00020; }
    .ok { color: #0a7b34; }
  </style>
</head>
<body>
  <h2>Golden Valley Admin</h2>
  <div class="muted">
    Loads from <b>users_portal</b> view (users + plots status).
  </div>

  <div class="row">
    <div class="card">
      <h3>Create Plot (Auto-create User)</h3>
      <label>Plot</label>
      <input id="newPlot" placeholder="Ex: A1" />
      <label>Status</label>
      <select id="newPlotStatus">
        <option value="available">available</option>
        <option value="overdue">overdue</option>
        <option value="terminated">terminated</option>
      </select>
      <button id="btnCreatePlot">Create Plot + User</button>
      <div id="createPlotMsg" class="muted"></div>
    </div>

    <div class="card">
      <h3>Edit User</h3>
      <label>User Email</label>
      <input id="editEmail" placeholder="a1@goldenvalley.com" />
      <label>User Name</label>
      <input id="editName" placeholder="Customer name" />
      <label>Phone</label>
      <input id="editPhone" placeholder="Phone number" />
      <label>Address</label>
      <input id="editAddress" placeholder="Address" />
      <label>Plot</label>
      <input id="editPlot" placeholder="Ex: A1" />
      <button id="btnUpsertUser">Save / Update User</button>
      <div id="editUserMsg" class="muted"></div>
    </div>

    <div class="card">
      <h3>Search</h3>
      <input id="search" placeholder="Search by email/name/plot" />
      <button id="btnReload">Reload</button>
      <div id="statusMsg" class="muted"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>User Email</th>
        <th>User Name</th>
        <th>Plot</th>
        <th>Plot Status</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="usersTbody"></tbody>
  </table>

  <!-- Supabase JS (UMD build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin.js"></script>
</body>
</html>
