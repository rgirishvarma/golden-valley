<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden Valley Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 10px; min-width: 280px; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px; }
    button { padding: 10px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f5f5f5; }
    .muted { color: #666; font-size: 13px; }
    .error { color: #b00020; }
    .ok { color: #0a7b34; }
  </style>
</head>
<body>
  <h2>Golden Valley Admin</h2>
  <div class="muted">Loads from <b>users_portal</b> view (users + plot status).</div>

  <div class="row">
    <div class="card">
      <h3>Create Plot (Auto-create User)</h3>
      <label>Plot</label>
      <input id="newPlot" placeholder="Ex: A1" />
      <label>Status</label>
      <select id="newPlotStatus">
        <option value="available">available</option>
        <option value="overdue">overdue</option>
        <option value="terminated">terminated</option>
      </select>
      <button id="btnCreatePlot">Create Plot + User</button>
      <div id="createPlotMsg" class="muted"></div>
    </div>

    <div class="card">
      <h3>Edit User</h3>
      <label>User Email</label>
      <input id="editEmail" placeholder="a1@goldenvalley.com" />
      <label>User Name</label>
      <input id="editName" placeholder="Customer name" />
      <label>Phone</label>
      <input id="editPhone" placeholder="Phone number" />
      <label>Address</label>
      <input id="editAddress" placeholder="Address" />
      <label>Plot</label>
      <input id="editPlot" placeholder="Ex: A1" />
      <button id="btnUpsertUser">Save / Update User</button>
      <div id="editUserMsg" class="muted"></div>
    </div>

    <div class="card">
      <h3>Search</h3>
      <input id="search" placeholder="Search by email/name/plot" />
      <button id="btnReload">Reload</button>
      <div id="statusMsg" class="muted"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>User Email</th>
        <th>User Name</th>
        <th>Plot</th>
        <th>Plot Status</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="usersTbody"></tbody>
  </table>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ======== PUT YOUR SUPABASE DETAILS HERE ========
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);

    function setMsg(el, msg, kind = "muted") {
      el.className = kind;
      el.textContent = msg || "";
    }

    function normalizePlot(plot) {
      return (plot || "").trim().toUpperCase();
    }
    function normalizeEmail(email) {
      return (email || "").trim().toLowerCase();
    }

    function renderRows(rows) {
      const tbody = $("usersTbody");
      tbody.innerHTML = "";

      rows.forEach((r) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.user_email ?? ""}</td>
          <td>${r.user_name ?? ""}</td>
          <td>${r.plot ?? ""}</td>
          <td>${r.plot_status ?? ""}</td>
          <td>${r.phone ?? ""}</td>
          <td>${r.address ?? ""}</td>
          <td><button data-id="${r.id}">Edit</button></td>
        `;

        tr.querySelector("button").addEventListener("click", () => {
          $("editEmail").value = r.user_email ?? "";
          $("editName").value = r.user_name ?? "";
          $("editPhone").value = r.phone ?? "";
          $("editAddress").value = r.address ?? "";
          $("editPlot").value = r.plot ?? "";
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        tbody.appendChild(tr);
      });
    }

    async function loadUsers() {
      const statusMsg = $("statusMsg");
      setMsg(statusMsg, "Loading...");

      const search = $("search").value.trim().toLowerCase();

      const { data, error } = await supabase
        .from("users_portal")
        .select("*")
        .order("plot", { ascending: true });

      if (error) {
        console.error(error);
        setMsg(statusMsg, "Error loading data: " + error.message, "error");
        renderRows([]);
        return;
      }

      const filtered = !search
        ? data
        : data.filter((r) => {
            const email = (r.user_email || "").toLowerCase();
            const name = (r.user_name || "").toLowerCase();
            const plot = (r.plot || "").toLowerCase();
            return email.includes(search) || name.includes(search) || plot.includes(search);
          });

      renderRows(filtered);
      setMsg(statusMsg, `Loaded ${filtered.length} rows`, "ok");
    }

    async function createPlotAndUser() {
      const msg = $("createPlotMsg");
      setMsg(msg, "Working...");

      const plot = normalizePlot($("newPlot").value);
      const status = ($("newPlotStatus").value || "available").trim().toLowerCase();

      if (!plot) {
        setMsg(msg, "Enter plot (ex: A1)", "error");
        return;
      }

      const email = `${plot.toLowerCase()}@goldenvalley.com`;

      // Insert/Update plot
      {
        const { error } = await supabase
          .from("plots")
          .upsert({ plot, status }, { onConflict: "plot" });

        if (error) {
          console.error(error);
          setMsg(msg, "Plot error: " + error.message, "error");
          return;
        }
      }

      // Insert/Update user
      {
        const { error } = await supabase
          .from("users")
          .upsert(
            { user_email: email, user_name: plot, plot: plot },
            { onConflict: "user_email" }
          );

        if (error) {
          console.error(error);
          setMsg(msg, "User error: " + error.message, "error");
          return;
        }
      }

      setMsg(msg, `Created/Updated ${plot} + ${email}`, "ok");
      $("newPlot").value = "";
      await loadUsers();
    }

    async function upsertUser() {
      const msg = $("editUserMsg");
      setMsg(msg, "Saving...");

      const user_email = normalizeEmail($("editEmail").value);
      const user_name = ($("editName").value || "").trim();
      const phone = ($("editPhone").value || "").trim();
      const address = ($("editAddress").value || "").trim();
      const plot = normalizePlot($("editPlot").value);

      if (!user_email) {
        setMsg(msg, "User Email is required", "error");
        return;
      }

      // Ensure plot exists if provided
      if (plot) {
        const { error: plotErr } = await supabase
          .from("plots")
          .upsert({ plot, status: "available" }, { onConflict: "plot" });

        if (plotErr) {
          console.error(plotErr);
          setMsg(msg, "Plot ensure error: " + plotErr.message, "error");
          return;
        }
      }

      const payload = {
        user_email,
        user_name: user_name || null,
        phone: phone || null,
        address: address || null,
        plot: plot || null,
      };

      const { error } = await supabase
        .from("users")
        .upsert(payload, { onConflict: "user_email" });

      if (error) {
        console.error(error);
        setMsg(msg, "Save error: " + error.message, "error");
        return;
      }

      setMsg(msg, "Saved successfully", "ok");
      await loadUsers();
    }

    $("btnReload").addEventListener("click", loadUsers);
    $("search").addEventListener("input", loadUsers);
    $("btnCreatePlot").addEventListener("click", createPlotAndUser);
    $("btnUpsertUser").addEventListener("click", upsertUser);

    loadUsers();
  </script>
</body>
</html>
