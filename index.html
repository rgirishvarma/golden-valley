<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Valley | Premium Gated Layout</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#000;
color:#fff;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 50px;
z-index:1000;
border-bottom:1px solid rgba(212,175,55,0.4);
}

.logo{
font-family:'Cinzel',serif;
color:#D4AF37;
font-size:22px;
letter-spacing:2px;
}

.nav-links a{
color:#fff;
text-decoration:none;
margin:0 15px;
font-size:14px;
}

.nav-links a:hover{color:#D4AF37}

/* HERO */
.hero{
height:100vh;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
margin-top:60px;
}

.hero img{
width:120px;
margin-bottom:20px;
border-radius:10px;
}

.hero h1{
font-family:'Cinzel',serif;
font-size:48px;
color:#D4AF37;
letter-spacing:3px;
}

.hero h2{
margin-top:10px;
font-weight:300;
letter-spacing:2px;
}

.limited{
margin-top:25px;
padding:8px 25px;
border:1px solid #D4AF37;
border-radius:30px;
font-size:13px;
}

.hero-buttons{margin-top:35px;}

.btn{
padding:14px 30px;
border-radius:30px;
font-weight:500;
margin:10px;
cursor:pointer;
letter-spacing:1px;
}

.gold{
background:#D4AF37;
color:#000;
border:none;
}

.outline{
background:transparent;
border:1px solid #D4AF37;
color:#D4AF37;
}

/* FLOATING BUTTON */
.floating-book{
position:fixed;
bottom:25px;
right:25px;
background:#D4AF37;
color:#000;
padding:15px 25px;
border-radius:50px;
font-weight:600;
cursor:pointer;
box-shadow:0 0 20px rgba(212,175,55,0.6);
z-index:3000;
animation:floatPulse 1.5s infinite;
}

@keyframes floatPulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* DIVIDER */
.divider{
width:80px;
height:2px;
background:#D4AF37;
margin:60px auto;
}

/* GOLD LINE */
.gold-line{
width:100%;
height:1px;
background:rgba(212,175,55,0.3);
margin:60px 0;
}

/* SECTION */
.section{
padding:100px 20px;
text-align:center;
}

.section h2{
font-family:'Cinzel',serif;
color:#D4AF37;
font-size:32px;
}

/* ===== PROJECT HIGHLIGHTS ===== */
.highlight-box{
display:flex;
justify-content:center;
align-items:center;
gap:80px;
flex-wrap:wrap;
margin-top:50px;
}

.highlight-item{
text-align:center;
}

.highlight-number{
font-size:65px;
font-weight:700;
color:#D4AF37;
margin-bottom:10px;
letter-spacing:2px;
}

.highlight-item span{
font-size:18px;
color:#fff;
}

/* ===== AMENITIES ===== */
.amenities{
padding:100px 20px;
text-align:center;
}

.amenities h2{
font-family:'Cinzel',serif;
color:#D4AF37;
font-size:32px;
}

.amenities ul{
list-style:none;
margin-top:40px;
max-width:600px;
margin-left:auto;
margin-right:auto;
line-height:2.2;
font-size:18px;
padding:0;
}

.amenities li{
padding:12px 0;
border-bottom:1px solid rgba(212,175,55,0.2);
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1000px;
margin:40px auto 0;
}

.gallery img, .gallery video{
width:100%;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* POPUP */
.modal{
display:none;
position:fixed;
z-index:4000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
}

.modal-content{
margin:auto;
display:block;
max-width:80%;
margin-top:5%;
border-radius:15px;
}

.close{
position:absolute;
top:30px;
right:50px;
color:#fff;
font-size:35px;
cursor:pointer;
}

/* MAP */
.map iframe{
width:100%;
height:450px;
border:0;
border-radius:15px;
margin-top:40px;
}

/* FORM */
form{
max-width:500px;
margin:40px auto 0;
display:flex;
flex-direction:column;
gap:15px;
}

input,textarea{
padding:14px;
border-radius:8px;
border:1px solid #333;
background:#111;
color:#fff;
}

button.submit{
background:#D4AF37;
color:#000;
padding:14px;
border:none;
border-radius:30px;
font-weight:600;
cursor:pointer;
}

footer{
text-align:center;
padding:25px;
border-top:1px solid rgba(212,175,55,0.3);
}
</style>
</head>
<body>
