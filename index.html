<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Valley</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html { scroll-behavior:smooth; }

body{
margin:0;
background:#111;
color:#ffffff;
font-family:'Playfair Display',serif;
}

section{
padding:80px 20px;
text-align:center;
}

h1,h2{
color:gold;
}

.gold-line{
height:2px;
width:80%;
margin:60px auto;
background:linear-gradient(to right,transparent,gold,transparent);
}

/* HERO */
.hero{
padding:120px 20px;
background:#1a1a1a;
}

.hero h1{
font-size:50px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
color:#ddd;
}

.btn{
display:inline-block;
padding:12px 30px;
margin:10px;
border:1px solid gold;
color:gold;
text-decoration:none;
font-size:16px;
cursor:pointer;
}

.btn:hover{
background:gold;
color:#000;
}

/* Gallery */
.gallery img, .gallery video{
width:250px;
margin:15px;
cursor:pointer;
}

/* Popup */
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:1000;
}

.popup img, .popup video{
max-width:90%;
max-height:80%;
}

.close{
position:absolute;
top:20px;
right:30px;
font-size:30px;
color:#fff;
cursor:pointer;
}

/* Floating */
.floating-btn{
position:fixed;
bottom:20px;
right:20px;
background:gold;
color:#000;
padding:15px 25px;
text-decoration:none;
font-weight:bold;
border-radius:5px;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<h1>Golden Valley</h1>
<p>Luxury Plots in Rayachoty</p>

<a href="#enquiry" class="btn">Book Your Plot</a>
<!-- ✅ Download Brochure Added -->
<a href="brochure.pdf" class="btn" download>Download Brochure</a>
</section>

<div class="gold-line"></div>

<!-- GALLERY -->
<section class="gallery">
<h2>Gallery</h2>

<img src="images/slide1.jpg" onclick="openImage(this.src)">
<img src="images/slide2.jpg" onclick="openImage(this.src)">
<img src="images/slide3.jpg" onclick="openImage(this.src)">

<!-- ✅ reel.mp4 clickable -->
<video src="images/reel.mp4" onclick="openVideo(this.src)" muted></video>

</section>

<!-- Popup -->
<div class="popup" id="popup">
<span class="close" onclick="closePopup()">×</span>
<img id="popup-img" style="display:none;">
<video id="popup-video" controls style="display:none;"></video>
</div>

<div class="gold-line"></div>

<!-- ENQUIRY -->
<section id="enquiry">
<h2>Enquiry Form</h2>

<form onsubmit="sendWhatsApp(); return false;">
<input type="text" id="name" placeholder="Your Name" required><br>
<input type="tel" id="phone" placeholder="Mobile Number" required><br>
<textarea id="message" placeholder="Your Message"></textarea><br>
<button class="btn">Submit</button>
</form>
</section>

<a href="https://wa.me/916303531088?text=I%20am%20interested%20in%20Golden%20Valley" class="floating-btn">
Book Plot
</a>

<script>

/* ===== WhatsApp ===== */
function sendWhatsApp(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let message=document.getElementById("message").value;

let url="https://wa.me/916303531088?text="
+"Name: "+name+"%0a"
+"Phone: "+phone+"%0a"
+"Message: "+message;

window.open(url,"_blank");
}

/* ===== Gallery Popup ===== */
function openImage(src){
document.getElementById("popup").style.display="flex";
document.getElementById("popup-img").style.display="block";
document.getElementById("popup-video").style.display="none";
document.getElementById("popup-img").src=src;
}

function openVideo(src){
document.getElementById("popup").style.display="flex";
document.getElementById("popup-video").style.display="block";
document.getElementById("popup-img").style.display="none";
let video=document.getElementById("popup-video");
video.src=src;
video.play();
}

function closePopup(){
document.getElementById("popup").style.display="none";
document.getElementById("popup-video").pause();
}

/* ===== Force Reload From Top ===== */
window.onload = function () {
window.scrollTo(0,0);
if ('scrollRestoration' in history) {
history.scrollRestoration = 'manual';
}
};

</script>

</body>
</html>
