<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Valley | Premium Gated Layout</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#000;
color:#fff;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 50px;
z-index:1000;
border-bottom:1px solid rgba(212,175,55,0.4);
}

.logo{
font-family:'Cinzel',serif;
color:#D4AF37;
font-size:22px;
letter-spacing:2px;
}

.nav-links a{
color:#fff;
text-decoration:none;
margin:0 15px;
font-size:14px;
}

.nav-links a:hover{color:#D4AF37}

/* HERO */
.hero{
height:100vh;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero img{
width:120px;
margin-bottom:20px;
border-radius:10px;
}

.hero h1{
font-family:'Cinzel',serif;
font-size:48px;
color:#D4AF37;
letter-spacing:3px;
}

.hero h2{
margin-top:10px;
font-weight:300;
letter-spacing:2px;
}

.limited{
margin-top:25px;
padding:8px 25px;
border:1px solid #D4AF37;
border-radius:30px;
font-size:13px;
}

.hero-buttons{margin-top:35px;}

.btn{
padding:14px 30px;
border-radius:30px;
font-weight:500;
margin:10px;
cursor:pointer;
letter-spacing:1px;
}

.gold{
background:#D4AF37;
color:#000;
border:none;
}

.outline{
background:transparent;
border:1px solid #D4AF37;
color:#D4AF37;
}

/* DIVIDER */
.divider{
width:80px;
height:2px;
background:#D4AF37;
margin:40px auto;
}

/* SECTION */
.section{
padding:100px 20px;
text-align:center;
}

.section h2{
font-family:'Cinzel',serif;
color:#D4AF37;
font-size:32px;
}

/* BOX */
.box{
border:1px solid rgba(212,175,55,0.4);
padding:30px;
border-radius:15px;
background:#111;
margin:10px;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1000px;
margin:40px auto 0;
}

.gallery img, .gallery video{
width:100%;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* POPUP MODAL */
.modal{
display:none;
position:fixed;
z-index:2000;
padding-top:100px;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
}

.modal-content{
margin:auto;
display:block;
max-width:80%;
border-radius:15px;
}

.close{
position:absolute;
top:30px;
right:50px;
color:#fff;
font-size:35px;
cursor:pointer;
}

/* MAP */
.map iframe{
width:100%;
height:400px;
border:0;
border-radius:15px;
margin-top:40px;
}

/* FORM */
form{
max-width:500px;
margin:40px auto 0;
display:flex;
flex-direction:column;
gap:15px;
}

input,textarea{
padding:14px;
border-radius:8px;
border:1px solid #333;
background:#111;
color:#fff;
}

button.submit{
background:#D4AF37;
color:#000;
padding:14px;
border:none;
border-radius:30px;
font-weight:600;
cursor:pointer;
}

footer{
text-align:center;
padding:25px;
border-top:1px solid rgba(212,175,55,0.3);
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
<div class="logo">Golden Valley</div>
<div class="nav-links">
<a href="#about">About</a>
<a href="#gallery">Gallery</a>
<a href="#location">Location</a>
<a href="#enquiry">Enquiry</a>
</div>
</div>

<!-- HERO -->
<section class="hero">
<img src="images/hero.jpg" alt="Logo">
<h1>Golden Valley</h1>
<h2>Premium Gated Layout | 7 Acres Development</h2>

<div class="limited">Limited Plots Available</div>

<div class="hero-buttons">
<a href="brochure.pdf" download>
<button class="btn gold">Download Brochure</button>
</a>
<a href="#enquiry">
<button class="btn outline">Book Your Plot</button>
</a>
</div>
</section>

<div class="divider"></div>

<!-- ABOUT -->
<section class="section" id="about">
<h2>Project Highlights</h2>
<div class="box">95 Premium Plots | 7 Acres | EMI ₹10,000</div>
</section>

<div class="divider"></div>

<!-- GALLERY -->
<section class="section" id="gallery">
<h2>Project Gallery</h2>

<div class="gallery">
<img src="images/slide1.jpg" onclick="openModal(this.src)">
<img src="images/slide2.jpg" onclick="openModal(this.src)">
<img src="images/slide3.jpg" onclick="openModal(this.src)">
<video controls>
<source src="images/reel.mp4" type="video/mp4">
</video>
</div>
</section>

<!-- IMAGE MODAL -->
<div id="imageModal" class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<img class="modal-content" id="modalImg">
</div>

<div class="divider"></div>

<!-- LOCATION -->
<section class="section" id="location">
<h2>Project Location</h2>

<div class="map">
<iframe 
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3869.655128043904!2d78.7923568!3d14.097524400000003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb30300746d83c1%3A0xfc286d1579787990!2sGolden%20Valley!5e0!3m2!1sen!2sin!4v1771307412055!5m2!1sen!2sin"
allowfullscreen=""
loading="lazy"
referrerpolicy="no-referrer-when-downgrade">
</iframe>
</div>

</section>


<div class="divider"></div>

<!-- ENQUIRY -->
<section class="section" id="enquiry">
<h2>Enquiry Form</h2>

<form id="enquiryForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="mobile" placeholder="10 Digit Mobile Number" required pattern="[0-9]{10}">
<textarea id="message" placeholder="Message" required></textarea>
<button type="submit" class="submit">Submit</button>
</form>
</section>

<footer>
© 2026 Golden Valley | Rayachoty
</footer>

<script>

/* IMAGE MODAL */
function openModal(src){
document.getElementById("imageModal").style.display="block";
document.getElementById("modalImg").src=src;
}

function closeModal(){
document.getElementById("imageModal").style.display="none";
}

/* WHATSAPP FORM */
document.getElementById("enquiryForm").addEventListener("submit",function(e){
e.preventDefault();
let name=document.getElementById("name").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let message=document.getElementById("message").value.trim();

if(!/^[0-9]{10}$/.test(mobile)){
alert("Enter valid 10 digit mobile number");
return;
}

let whatsapp="919912799455";
let text=`New Enquiry:%0AName:${name}%0AMobile:${mobile}%0AMessage:${message}`;
window.open(`https://wa.me/${whatsapp}?text=${text}`,'_blank');
this.reset();
});
</script>

</body>
</html>
